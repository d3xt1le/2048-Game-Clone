<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="2048.css">
    <script src="2048.js"></script>
</head>

<body>
    <h1> 2048</h1>
    <hr>
    <h2>
        Score: <span id="score">0</span>
        <button id="reset" onclick="resetGame()">RESET &#11118;</button>
    </h2>
    <div id="board"></div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2>Game Over, you lost!</h2>
            <p id="finalScore"></p>
            <button id="restartButton">Restart Game</button>
        </div>
    </div>

    <!-- Game Won Modal -->
    <div id="gameWonModal" class="modal">
        <div class="modal-content">
            <h2>Game Over, you won!</h2>
            <p id="finalScore"></p>
            <button id="restartButton">Restart Game</button>
            <button id="continueButton">Continue Game</button>
        </div>
    </div>
</body>

</html>
